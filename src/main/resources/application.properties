server.port=${PORT:8080}
server.forward-headers-strategy=framework

# MySQL (override with env vars in production)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/bookstore?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.dialect=${DB_DIALECT:org.hibernate.dialect.MySQLDialect}

app.admin.email=${ADMIN_EMAIL:admin@bookstore.com}
app.admin.password=${ADMIN_PASSWORD:admin123}
