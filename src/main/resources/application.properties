server.port=${PORT:8080}
server.forward-headers-strategy=framework

# Database: if DB_URL is not set, an in-memory H2 database is used so the app ALWAYS starts.
# For MySQL set:  DB_URL=jdbc:mysql://localhost:3306/bookstore?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.url=${DB_URL:jdbc:h2:mem:bookstore;MODE=MySQL;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=true

app.admin.email=${ADMIN_EMAIL:admin@bookstore.com}
app.admin.password=${ADMIN_PASSWORD:admin123}
